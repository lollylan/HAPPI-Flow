appId: de.praxis.haeppiflow
productName: HÄPPI-Flow
copyright: Praxis

directories:
  output: ../../release

files:
  - dist/**/*
  - server-dist/**/*
  - package.json

# Nur die Oberflaeche als statische Dateien. Bewusst KEINE Datenbank und
# kein Schluessel: die Vorgaengerversion lieferte happi-flow.db und
# secret.key im Installer mit, also echte Mitarbeiterdaten an jeden, der
# die Datei bekam.
extraResources:
  - from: resources/client
    to: client

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: HAEPPI-Flow-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HÄPPI-Flow

# Native Module muessen entpackt vorliegen - aus einem asar-Archiv laesst
# sich keine .node-Datei laden.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@node-rs/**'
  - '**/node_modules/bindings/**'

npmRebuild: true
